syntax = "proto3";
option java_package = "com.lokalno.foldersync";
option java_outer_classname = "FolderSyncProto";

service FolderSync {
  // Bi-directional stream
  rpc Sync(stream FileMessage) returns (stream FileMessage);
  rpc VerifyToken (AuthRequest) returns (AuthResponse);
}

message FileMessage {
  string path = 1;       // relative path
  bytes content = 2;     // chunk of file
  bool is_chunk_end = 3; // mark end of file
  int32 position = 4;    // position of chunk
  bool delete = 5;       // mark file deletion
  int32 chunkSize = 6;
}

message AuthRequest {
  string token = 1;
}

message AuthResponse {
  bool success = 1;
}

